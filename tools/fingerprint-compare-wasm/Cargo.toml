[package]
name = "fingerprint-compare-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "WASI chromaprint fingerprint compare helper for Prairie Server (no CGO)"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
