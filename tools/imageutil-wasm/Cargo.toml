[package]
name = "imageutil-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "WASI image resize/encode helper for Prairie Server (no CGO)"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
resvg = "0.47.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zenwebp = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
