<!doctype html>
<html lang="en" data-theme="prairie-dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prairie</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.avif" type="image/avif" sizes="32x32" />
    <link rel="icon" href="/favicon-32.webp" type="image/webp" sizes="32x32" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Default theme (prairie-dusk): Sora + Fraunces — weight ranges match UI usage -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Sora:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!-- Alternate themes + theme-editor fonts: stay non-blocking until a
         non-default theme (or the theme editor) needs them. -->
    <link
      id="prairie-theme-fonts"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Outfit:wght@400..700&family=Urbanist:wght@400..700&display=swap"
      rel="stylesheet"
      media="print"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Outfit:wght@400..700&family=Urbanist:wght@400..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
