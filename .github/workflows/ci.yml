name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVER_MIN: "90"

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # only-new-issues needs full history vs the PR base.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web/dist for embed
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>prairie</title>' > web/dist/index.html

      # Prefer git merge-base over the action's only-new-issues PR-patch fetch.
      # GitHub refuses PR diffs over 300 files, and the action then falls back to
      # linting the whole tree against ~2k pre-existing findings (goconst/errcheck
      # debt) — which looks like intermittent CI failure on large asset PRs.
      - name: Fetch PR base for merge-base lint
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: golangci-lint (new issues vs base)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: false
          args: >-
            --timeout=10m
            ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '--new-from-rev=HEAD~1' }}

  web-lint:
    name: Web lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Typecheck (tsc -b)
        run: pnpm exec tsc -b --pretty false

  go-test-coverage:
    name: Go tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # Scope CI to packages listed in .github/coverage-packages.txt (plus
          # jellycompat / LiveTV handlers for integration-ish coverage).
          # `go test ./...` currently fails on unrelated suites (playback_v3
          # seek recovery, web embed without a built dist/) and is not gated
          # on main. Full suite remains: `make test-coverage` locally (after
          # `pnpm run build` in web/ so embed finds dist/).
          #
          # coverage.out must include every package in coverage-packages.txt.
          # imageutil is CGO-free (embedded WASI) — keep a smoke gate here so the
          # committed .wasm cannot rot without CI noticing.
          go test \
            ./internal/livetv/... \
            ./internal/jellycompat/... \
            ./internal/imageutil/ \
            ./internal/artworkkey/ \
            ./internal/contentid/... \
            ./internal/librarykind/... \
            ./internal/logredact/... \
            ./internal/logfilter/... \
            ./internal/titleutil/... \
            ./internal/lang/... \
            ./internal/rootcheck/... \
            ./internal/secret/... \
            ./internal/providerid/... \
            ./internal/buildinfo/... \
            -count=1 -covermode=atomic -coverprofile=coverage.out
          # Native Live TV HTTP handlers live in internal/api/handlers; run only
          # those tests so we do not pull in the full handlers suite.
          go test ./internal/api/handlers/ -count=1 -run 'LiveTV'

      - name: Enforce coverage gate
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' .github/coverage-packages.txt || true)
          export COVER_PACKAGES="${pkgs[*]}"
          # PgStore (DB) lives in store.go and is impractical to unit-test here.
          export COVER_EXCLUDE_FILE_REGEX='(^|/)store\.go$'
          chmod +x scripts/check-go-coverage.sh
          ./scripts/check-go-coverage.sh coverage.out "${COVER_MIN}"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  web-test-coverage:
    name: Web tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match docker.yml: pin major here. Do not also pass package_json_file
          # (web/package.json packageManager would conflict with "version").
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck + lint already run in web-lint (parallel job). Keep this job
      # focused on Vitest so the critical path is ~vitest wall-clock only.
      # Vitest coverage thresholds (90% statements/lines/functions/branches) apply
      # to the include list in web/vite.config.ts (pure helpers under src/lib/).
      # Expand that list as more modules gain unit tests rather than gating the
      # entire web tree, which is still well below 90% overall.
      - name: Run Vitest with coverage
        run: pnpm exec vitest run --coverage

      - name: npm audit (production deps)
        run: pnpm audit --prod --audit-level=high

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  go-vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        # imageutil is CGO-free (embedded WASI); no libvips headers required.
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  rust-imageutil:
    name: Rust imageutil (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imageutil-wasm
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pin to the same major as tools/imageutil-wasm/Dockerfile (ravif needs edition2024).
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/imageutil-wasm

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
