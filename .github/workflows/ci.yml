name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVER_MIN: "95"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go }}
      go_jellycompat: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go_jellycompat }}
      go_imageutil: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go_imageutil }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      rust_imageutil: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust_imageutil }}
      rust_fingerprint_compare: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust_fingerprint_compare }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - 'go.mod'
              - 'go.sum'
              - '**.go'
              - '.golangci.yml'
              - '.github/coverage-packages.txt'
              - 'scripts/check-go-coverage.sh'
              - 'scripts/ci-go-lint.sh'
              - 'scripts/ci-go-lint-packages.sh'
              - '.github/workflows/ci.yml'
            go_jellycompat:
              - 'internal/jellycompat/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            go_imageutil:
              - 'internal/imageutil/**'
              - 'tools/imageutil-wasm/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            rust_imageutil:
              - 'tools/imageutil-wasm/**'
              - '.github/workflows/ci.yml'
            rust_fingerprint_compare:
              - 'tools/fingerprint-compare-wasm/**'
              - '.github/workflows/ci.yml'

  # Build-free tripwire for Prairie-only code that upstream syncs have deleted
  # before (stream-token auth, Live TV wiring, Tizen fixes). Unfiltered so it
  # runs on every PR, including a sync that only touches files it resolves to
  # upstream. See docs/upstream-sync.md.
  prairie-invariants:
    name: Prairie invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Prairie invariants
        run: scripts/check-prairie-invariants.sh

  # Single lint job (not matrix-sharded): each shard still typechecks the module
  # graph, so 4-way split left wall clock ~2.5m while burning 4 runners. PRs lint
  # only packages with changed .go files; main/dispatch keep a full-module pass.
  # Workflow / CI-script-only diffs emit zero packages and skip analysis.
  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Merge-base / changed-package lint needs history vs origin/<base>.
          fetch-depth: 100

      # github.com/h2non/bimg binds libvips through cgo and pkg-config (silo
      # imageutil); nothing under ./... compiles without the headers.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web/dist for embed
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>prairie</title>' > web/dist/index.html

      # Prefer git merge-base over the action's only-new-issues PR-patch fetch.
      # GitHub refuses PR diffs over 300 files, and the action then falls back to
      # linting the whole tree against ~2k pre-existing findings (goconst/errcheck
      # debt) — which looks like intermittent CI failure on large asset PRs.
      - name: Fetch PR base for merge-base lint
        if: github.event_name == 'pull_request'
        env:
          # Pass via env — interpolating github.base_ref into the shell is an injection risk.
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin "${PR_BASE_REF}"
          if ! git merge-base --is-ancestor "origin/${PR_BASE_REF}" HEAD 2>/dev/null \
            && ! git merge-base "HEAD" "origin/${PR_BASE_REF}" >/dev/null 2>&1; then
            git fetch --no-tags --deepen=500 origin "${PR_BASE_REF}"
            git fetch --no-tags --deepen=500 origin "${{ github.sha }}" || true
          fi

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: golangci-lint
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          # PRs lint changed packages only; main/dispatch keep a full-module pass.
          CI_GO_LINT_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          CI_GO_LINT_NEW_FROM_MERGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          CI_GO_LINT_NEW_FROM_REV: ${{ github.event_name != 'pull_request' && 'HEAD~1' || '' }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci-go-lint.sh scripts/ci-go-lint-packages.sh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./scripts/ci-go-lint.sh "origin/${PR_BASE_REF}"
          else
            ./scripts/ci-go-lint.sh
          fi

  # Upstream's contract gate (settings bindings, playback fixtures, v2 route
  # inventory / ledger / scenario catalogs / OpenAPI artifact / fixtures).
  go-verify:
    name: Go contract checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The contract diff compares against the PR's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: verify

      # A manifest change that does not regenerate leaves every client reading
      # stale keys, which the contract exists to prevent.
      - name: Verify settings bindings are current
        run: make verify-settings-bindings

      # The server defines the playback protocol and the clients prove
      # conformance against these fixtures. A contract change that does not
      # regenerate leaves every client testing against a stale body, so the
      # drift surfaces as a playback bug on three platforms rather than as a
      # failure here.
      - name: Verify playback protocol fixtures are current
        run: make verify-playback-fixtures

      # The API v2 migration needs every legacy native route accounted for
      # before anything is ported. The generator reads registration source, so
      # a route hidden behind optional dependency wiring still has to appear,
      # and a registration it cannot follow fails here rather than shrinking
      # the inventory in silence.
      - name: Verify the legacy native route inventory is current
        run: make verify-route-inventory

      # Every inventoried route needs a migration decision before v2 work
      # ports it. The ledger is schema-checked and reconciled against the
      # inventory one-to-one, so a new route without a ledger entry, or a
      # stale entry for a removed route, fails here.
      - name: Verify the v2 migration ledger covers the route inventory
        run: make verify-migration-ledger

      # Every tier-1 row in a migration wave needs an executable scenario
      # catalog before that wave's first section PR. The catalogs are
      # schema-checked and reconciled against the ledger here; the executor
      # runs their public subset under make test-go and the rest locally
      # against an empty database named by PRAIRIE_SCENARIO_DATABASE_URL (a
      # dedicated variable: the executor truncates, so it never shares
      # PRAIRIE_TEST_DATABASE_URL with the other DB-gated packages).
      - name: Verify the tier-1 scenario catalogs cover their waves
        run: make verify-scenario-catalogs

      # The executor's offline run-vs-skip decision reads a committed list of
      # the routes the no-database API router registers, because the sealed
      # router cannot be walked from outside internal/api. This regenerates
      # that list from the real router and fails if the committed file drifted.
      - name: Verify the offline route set matches the API router
        run: make verify-offline-routes

      # The v2 OpenAPI artifact is rendered from the Go registries and the
      # binary serves the committed bytes, so a registration change that does
      # not regenerate leaves clients reading a contract the server no longer
      # matches. This byte-compares a fresh generation.
      - name: Verify the v2 OpenAPI artifact is current
        run: make verify-apiv2-openapi

      # The v2 fixtures are generated through the real router and every body
      # is validated against the committed OpenAPI schema its index names, so
      # a client testing against them tests against what the server sends.
      - name: Verify the v2 contract fixtures are current and valid
        run: make verify-apiv2-fixtures

  web-lint:
    name: Web lint + format
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint
        run: pnpm run lint

      - name: Oxfmt check
        run: pnpm run format:check

      - name: Typecheck (tsc -b)
        run: pnpm exec tsc -b --pretty false

  # jellycompat is the heavy suite (~17k test LOC). Run it in parallel with the
  # coverage-gated packages and imageutil WASM smoke so wall clock is ~max(suite)
  # instead of sum. Path-filtered so web-only PRs skip it.
  go-test-jellycompat:
    name: Go jellycompat tests
    needs: changes
    if: needs.changes.outputs.go_jellycompat == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Own the build/mod cache below so restore-keys can reuse dependency
          # objects across jellycompat source edits (tests ~3s; cold compile ~1m).
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-jellycompat-${{ hashFiles('go.sum') }}-${{ hashFiles('internal/jellycompat/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-jellycompat-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-jellycompat-

      - name: Run jellycompat tests
        # -vet=off: golangci already covers vet/staticcheck; vet-during-test
        # re-typechecks the 600+ dependency graph on cold runners.
        run: |
          set -euo pipefail
          go mod download
          go test ./internal/jellycompat/... -count=1 -vet=off

  # Embedded WASI AVIF encode is CPU-heavy; keep it off the coverage-package path
  # and only run when imageutil / its WASM toolchain changes.
  go-test-imageutil:
    name: Go imageutil tests
    needs: changes
    if: needs.changes.outputs.go_imageutil == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run imageutil WASM smoke tests
        run: go test ./internal/imageutil/ -count=1 -vet=off

  go-test-coverage:
    name: Go tests + coverage
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web/dist for embed
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>prairie</title>' > web/dist/index.html

      # Scoped lint can miss breakage in unchanged importers; a full compile
      # catches that without re-running the whole test suite.
      - name: Compile all packages
        run: go build -o /dev/null ./...

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # Scope CI to packages listed in .github/coverage-packages.txt.
          # jellycompat / imageutil run in parallel sibling jobs.
          # Everything else runs, ungated by coverage, in go-test-full.
          #
          # coverage.out must include every package in coverage-packages.txt.
          # covermode=set is enough: CI does not use -race, and atomic is slower.
          # LiveTV HTTP handler tests live in internal/api/handlers but compiling
          # that package (~58k LOC) for two smoke tests dominated this job; the
          # livetv service suite above already gates Live TV behavior.
          go test \
            ./internal/livetv/... \
            ./internal/artworkkey/ \
            ./internal/contentid/... \
            ./internal/librarykind/... \
            ./internal/logredact/... \
            ./internal/logfilter/... \
            ./internal/titleutil/... \
            ./internal/lang/... \
            ./internal/rootcheck/... \
            ./internal/secret/... \
            ./internal/providerid/... \
            ./internal/buildinfo/... \
            -count=1 -vet=off -covermode=set -coverprofile=coverage.out

      - name: Enforce coverage gate
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' .github/coverage-packages.txt || true)
          export COVER_PACKAGES="${pkgs[*]}"
          # PgStore / pg artwork index (DB) are impractical to unit-test here.
          export COVER_EXCLUDE_FILE_REGEX='(^|/)(store|artwork_index_pg)\.go$'
          chmod +x scripts/check-go-coverage.sh
          ./scripts/check-go-coverage.sh coverage.out "${COVER_MIN}"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

      # Folded in from a dedicated job to save a runner slot; still gated on Go
      # path changes via this job's `if`.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Every Go package that the coverage-gated job and the jellycompat /
  # imageutil siblings do not run. Before this job, metadata, api/handlers,
  # playback, apiv2, scenariocatalog, database and the rest ran nowhere in CI,
  # so upstream syncs could silently drop Prairie fixes (#174) or leave tests
  # asserting upstream-only behaviour. DB-gated tests skip without
  # PRAIRIE_TEST_DATABASE_URL / PRAIRIE_SCENARIO_DATABASE_URL, and Live TV
  # tests use fake tuners, so no hardware is needed. Split in two so the heavy
  # HTTP packages compile in parallel with the rest.
  go-test-full:
    name: Go tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [http, rest]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web/dist for embed
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>prairie</title>' > web/dist/index.html

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # jellycompat and imageutil have their own jobs.
          all=$(go list ./... | grep -vE '/internal/(jellycompat|livetv|contentid|librarykind|logredact|logfilter|titleutil|lang|rootcheck|secret|providerid|buildinfo|artworkkey|imageutil)(/|$)')
          http_re='/internal/(api|apiv2)(/|$)'
          if [[ "$SHARD" == "http" ]]; then
            pkgs=$(grep -E "$http_re" <<<"$all")
          else
            pkgs=$(grep -vE "$http_re" <<<"$all")
          fi
          # -vet=off: golangci already covers vet.
          go test $pkgs -count=1 -vet=off -timeout 30m

  # Kept as a named check for branch-protection compatibility; work lives in
  # go-test-coverage. Must not treat a failed coverage job as a successful skip.
  go-vulncheck:
    name: Go vulnerability check
    needs: [changes, go-test-coverage]
    if: always() && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require Go tests + coverage (includes govulncheck)
        run: |
          set -euo pipefail
          result="${{ needs.go-test-coverage.result }}"
          echo "go-test-coverage result: ${result}"
          test "$result" = "success"

  web-test-coverage:
    name: Web tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match docker.yml: pin major here. Do not also pass package_json_file
          # (web/package.json packageManager would conflict with "version").
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shard Vitest across runners; blob reports merge in web-coverage-report.
      # happy-dom + forks cut per-shard wall clock; thresholds are enforced on merge.
      - name: Run Vitest shard with coverage
        env:
          VITEST_SHARD: "1"
        # Catalog.test.tsx is upstream's known web failure (WEBTEST_KNOWN_FAILURES in
        # the Makefile); it stays out of the gate the same way upstream keeps it out.
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --exclude src/pages/Catalog.test.tsx

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-vitest-blob-${{ matrix.shard }}
          path: web/.vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web-coverage-report:
    name: Web coverage gate
    needs: [changes, web-test-coverage]
    # Run whenever web changed so a failed shard cannot skip this required check.
    if: always() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      # Must run before defaults.working-directory=web (no checkout yet).
      - name: Require web test shards
        run: |
          set -euo pipefail
          result="${{ needs.web-test-coverage.result }}"
          echo "web-test-coverage result: ${result}"
          test "$result" = "success"

      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: web-vitest-blob-*
          path: web/.vitest-reports
          merge-multiple: true

      - name: Merge shard reports and enforce coverage
        working-directory: web
        run: pnpm exec vitest --mergeReports --coverage

      - name: npm audit (production deps)
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  rust-imageutil:
    name: Rust imageutil (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.rust_imageutil == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imageutil-wasm
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pin to the same major as tools/imageutil-wasm/Dockerfile (ravif needs edition2024).
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/imageutil-wasm

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  rust-fingerprint-compare:
    name: Rust fingerprint compare (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.rust_fingerprint_compare == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fingerprint-compare-wasm
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/fingerprint-compare-wasm

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
