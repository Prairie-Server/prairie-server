name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVER_MIN: "75"

jobs:
  go-test-coverage:
    name: Go tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # Scope CI to packages listed in .github/coverage-packages.txt (plus
          # jellycompat / LiveTV handlers for integration-ish coverage).
          # `go test ./...` currently fails on unrelated suites (playback_v3
          # seek recovery, web embed without a built dist/) and is not gated
          # on main. Full suite remains: `make test-coverage` locally (after
          # `pnpm run build` in web/ so embed finds dist/).
          #
<<<<<<< HEAD
