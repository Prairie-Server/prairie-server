            -count=1 -covermode=atomic -coverprofile=coverage.out
          # Native Live TV HTTP handlers live in internal/api/handlers; run only
          # those tests so we do not pull in the full handlers suite.
          go test ./internal/api/handlers/ -count=1 -run 'LiveTV'

      - name: Enforce coverage gate
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' .github/coverage-packages.txt || true)
          export COVER_PACKAGES="${pkgs[*]}"
          # PgStore (DB) lives in store.go and is impractical to unit-test here.
          export COVER_EXCLUDE_FILE_REGEX='(^|/)store\.go$'
          chmod +x scripts/check-go-coverage.sh
          ./scripts/check-go-coverage.sh coverage.out "${COVER_MIN}"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  web-test-coverage:
    name: Web tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match docker.yml: pin major here. Do not also pass package_json_file
          # (web/package.json packageManager would conflict with "version").
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest coverage thresholds (75% statements/lines/functions/branches) apply
      # to the include list in web/vite.config.ts (pure helpers under src/lib/).
      # Expand that list as more modules gain unit tests rather than gating the
      # entire web tree, which is still well below 75% overall.
      - name: Run Vitest with coverage
        run: pnpm exec vitest run --coverage

      - name: npm audit (production deps)
        run: pnpm audit --prod --audit-level=high

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  go-vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Use the same toolchain as go.mod (setup-go already installed it).
        run: "$(go env GOPATH)/bin/govulncheck" ./...
