name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVER_MIN: "95"

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Merge-base lint needs enough history to reach origin/<base>.
          # Cap depth so cold clones stay cheap; deepen if merge-base fails.
          fetch-depth: 100

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web/dist for embed
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>prairie</title>' > web/dist/index.html

      # Prefer git merge-base over the action's only-new-issues PR-patch fetch.
      # GitHub refuses PR diffs over 300 files, and the action then falls back to
      # linting the whole tree against ~2k pre-existing findings (goconst/errcheck
      # debt) — which looks like intermittent CI failure on large asset PRs.
      - name: Fetch PR base for merge-base lint
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin "${{ github.base_ref }}"
          # Deepen if this PR branched farther back than the shallow window.
          if ! git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD 2>/dev/null \
            && ! git merge-base "HEAD" "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            git fetch --no-tags --deepen=500 origin "${{ github.base_ref }}"
            git fetch --no-tags --deepen=500 origin "${{ github.sha }}" || true
          fi

      - name: golangci-lint (new issues vs base)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin for stable binary + action cache hits (latest churns cold installs).
          version: v2.12.2
          only-new-issues: false
          args: >-
            --timeout=5m
            ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '--new-from-rev=HEAD~1' }}

  web-lint:
    name: Web lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint
        run: pnpm run lint

      - name: Oxfmt check
        run: pnpm run format:check

      - name: Typecheck (tsc -b)
        run: pnpm exec tsc -b --pretty false

  # jellycompat is the heavy suite (~17k test LOC). Run it in parallel with the
  # coverage-gated packages and imageutil WASM smoke so wall clock is ~max(suite)
  # instead of sum.
  go-test-jellycompat:
    name: Go jellycompat tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run jellycompat tests
        run: go test ./internal/jellycompat/... -count=1

  # Embedded WASI AVIF encode is CPU-heavy (~1m locally); keep it off the
  # coverage-package critical path.
  go-test-imageutil:
    name: Go imageutil tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run imageutil WASM smoke tests
        run: go test ./internal/imageutil/ -count=1

  go-test-coverage:
    name: Go tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # Scope CI to packages listed in .github/coverage-packages.txt.
          # jellycompat / imageutil run in parallel sibling jobs.
          # `go test ./...` currently fails on unrelated suites (playback_v3
          # seek recovery, web embed without a built dist/) and is not gated
          # on main. Full suite remains: `make test-coverage` locally (after
          # `pnpm run build` in web/ so embed finds dist/).
          #
          # coverage.out must include every package in coverage-packages.txt.
          # covermode=set is enough: CI does not use -race, and atomic is slower.
          # LiveTV HTTP handler tests live in internal/api/handlers but compiling
          # that package (~58k LOC) for two smoke tests dominated this job; the
          # livetv service suite above already gates Live TV behavior.
          go test \
            ./internal/livetv/... \
            ./internal/artworkkey/ \
            ./internal/contentid/... \
            ./internal/librarykind/... \
            ./internal/logredact/... \
            ./internal/logfilter/... \
            ./internal/titleutil/... \
            ./internal/lang/... \
            ./internal/rootcheck/... \
            ./internal/secret/... \
            ./internal/providerid/... \
            ./internal/buildinfo/... \
            -count=1 -covermode=set -coverprofile=coverage.out

      - name: Enforce coverage gate
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' .github/coverage-packages.txt || true)
          export COVER_PACKAGES="${pkgs[*]}"
          # PgStore (DB) lives in store.go and is impractical to unit-test here.
          export COVER_EXCLUDE_FILE_REGEX='(^|/)store\.go$'
          chmod +x scripts/check-go-coverage.sh
          ./scripts/check-go-coverage.sh coverage.out "${COVER_MIN}"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  web-test-coverage:
    name: Web tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match docker.yml: pin major here. Do not also pass package_json_file
          # (web/package.json packageManager would conflict with "version").
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shard Vitest across runners; blob reports merge in web-coverage-report.
      # happy-dom + forks cut per-shard wall clock; thresholds are enforced on merge.
      - name: Run Vitest shard with coverage
        env:
          VITEST_SHARD: "1"
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-vitest-blob-${{ matrix.shard }}
          path: web/.vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web-coverage-report:
    name: Web coverage gate
    needs: web-test-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: web-vitest-blob-*
          path: web/.vitest-reports
          merge-multiple: true

      - name: Merge shard reports and enforce coverage
        run: pnpm exec vitest --mergeReports --coverage

      - name: npm audit (production deps)
        run: pnpm audit --prod --audit-level=high

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  go-vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        # imageutil is CGO-free (embedded WASI); no libvips headers required.
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  rust-imageutil:
    name: Rust imageutil (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imageutil-wasm
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pin to the same major as tools/imageutil-wasm/Dockerfile (ravif needs edition2024).
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/imageutil-wasm

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
