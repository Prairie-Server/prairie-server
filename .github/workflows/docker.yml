name: Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase; pin Prairie's package path explicitly so a
  # mis-cased github.repository (or a fork) cannot publish to the wrong hub.
  IMAGE_NAME: prairie-server/prairie-server
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/prairie-server/*
  GONOSUMDB: github.com/prairie-server/*

jobs:
  prepare:
    name: Prepare build identity
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
      built_at: ${{ steps.identity.outputs.built_at }}
      image_version: ${{ steps.identity.outputs.image_version }}
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["refs/heads/main","refs/heads/apiv2"]'), github.ref)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["main","apiv2"]'), github.event.workflow_run.head_branch))
    steps:
      - name: Resolve build identity
        id: identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::Repository default branch is unavailable."
            exit 1
          fi

          build_number=""
          image_version="${GITHUB_SHA::7}"
          if [[ "$TARGET_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            build_number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
            if (( build_number <= 0 )); then
              echo "::error::Build number must be positive."
              exit 1
            fi
            image_version="build-${build_number}"
          fi

          {
            echo "build_number=${build_number}"
            echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "image_version=${image_version}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    uses: Prairie-Server/prairie-server/.github/workflows/trusted-linux-build.yml@main
    with:
      platform: ${{ matrix.platform }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      image_version: ${{ needs.prepare.outputs.image_version }}

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success'"
    permissions:
      packages: write

    steps:
      - name: Prepare image name
        run: echo "IMAGE_LC=${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)

      - name: Inspect manifest list
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${GITHUB_SHA::7}"
