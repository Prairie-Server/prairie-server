groups:
  - name: prairie_observability
    rules:
      - record: prairie:queue_items:max
        expr: max by (cluster, queue, state) (prairie_queue_items)
      - record: prairie:queue_oldest_requested_timestamp_seconds:min
        expr: min by (cluster, queue, state) (prairie_queue_oldest_requested_timestamp_seconds)
      - alert: PrairieTargetUnavailable
        expr: up{job="prairie"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Prairie scrape target is unavailable
          description: Check process/container health and network access before interpreting missing metrics as idle work.
      - alert: PrairieResourceSampleStale
        expr: prairie_resource_sample_stale == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Prairie resource sampling stopped advancing
          description: Inspect source availability and the local profiler for blocked sampling; check mount and GPU probe health.
      - alert: PrairieQueueSamplingFailed
        expr: prairie_queue_sample_available == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A shared queue cannot be measured
          description: Check PostgreSQL pool waits and dependency errors; absent queue values do not mean an empty queue.
      - alert: PrairieQueueAgeHigh
        expr: (time() - prairie:queue_oldest_requested_timestamp_seconds:min{state="queued"}) > 1800
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Prairie has old queued work
          description: Includes delayed retries. Inspect queue retry gates, worker attempts and admin job progress before treating this as a stall.
      - alert: PrairieCgroupMemoryHigh
        expr: prairie_cgroup_memory_current_bytes / prairie_cgroup_memory_limit_bytes > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Prairie cgroup memory is near its reported limit
          description: Compare Go heap, process RSS, children and cache; these populations overlap. Check cgroup events and container history.
      - alert: PrairieCgroupOOM
        expr: increase(prairie_cgroup_memory_oom_kills_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: An OOM kill occurred in the measured cgroup
          description: The killed process may be a child. Also check orchestrator restart/OOM status because a dead Prairie cannot scrape its own event.
      - alert: PrairieCPUThrottled
        expr: rate(prairie_cgroup_cpu_throttled_periods_total[5m]) / clamp_min(rate(prairie_cgroup_cpu_periods_total[5m]), 0.001) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Prairie cgroup CPU throttling is sustained
          description: Compare quota cores, request latency and task demand; capture CPU for one process and inspect owned FFmpeg usage separately.
      - alert: PrairieOTLPExportFailure
        expr: sum by (cluster, instance, signal) (increase(prairie_otel_export_records_total{outcome="error"}[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Prairie telemetry exports are failing
          description: Check collector health and bounded queue loss after drain. Telemetry failure must not block requests.
      - alert: PrairieScrapeSlow
        expr: scrape_duration_seconds{job="prairie"} > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Prairie scrapes exceed the target budget
          description: Inspect sample count and collector contention before increasing the timeout.
      - alert: PrairiePostgresPoolSaturated
        expr: sum without (state) (prairie_postgres_pool_connections{state="acquired"}) / sum without (state) (prairie_postgres_pool_connections{state="maximum"}) > 0.9
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A Prairie PostgreSQL pool is near capacity
          description: Compare postgres acquire duration and timeout/error outcomes by pool role, then inspect long transactions and query spans before increasing the connection limit.
