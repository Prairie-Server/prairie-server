services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-8gb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prairie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prairie}
      POSTGRES_DB: ${POSTGRES_DB:-prairie}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/postgres:/var/lib/postgresql
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prairie}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    # Pinned: Meilisearch will not open data written by another version.
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.54.0}
    restart: unless-stopped
    profiles: [search]
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ -z "$${MEILI_MASTER_KEY:-}" ]; then
          echo "MEILI_MASTER_KEY is required when enabling the search profile" >&2
          exit 1
        fi
        exec /bin/meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_UPGRADE_DB: ${MEILI_UPGRADE_DB:-false}
    ports:
      - "${MEILISEARCH_HOST:-127.0.0.1}:${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/meilisearch:/meili_data

  prairie:
    image: ${PRAIRIE_IMAGE:-ghcr.io/prairie-server/prairie-server:latest}
    restart: unless-stopped
    environment:
      MODE: integrated
      # Keep the container listeners fixed. PORT and JF_PORT in .env are
      # host-side published-port overrides.
      PORT: "8080"
      JF_PORT: "8096"
      # Master key for at-rest credential encryption. Required — the server
      # refuses to start without it. Generate with: openssl rand -base64 48
      # Back it up SEPARATELY from your database dumps; losing it makes encrypted
      # secrets unrecoverable. See docs/architecture/secret-encryption.md.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
      DATABASE_URL: postgres://${POSTGRES_USER:-prairie}:${POSTGRES_PASSWORD:-prairie}@postgres:5432/${POSTGRES_DB:-prairie}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PRAIRIE_PLUGIN_CACHE_DIR: /var/lib/prairie/plugins
      POSTGRES_TUNE: ${POSTGRES_TUNE:-auto}
    ports:
      - "${PORT:-8090}:8080"
      - "${JF_PORT:-8096}:8096"
      - "${ABS_PORT:-13378}:13378"
    volumes:
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
      - ${MEDIA_BOOKS_ROOT:-${MEDIA_ROOT}}:${MEDIA_BOOKS_CONTAINER_ROOT:-${MEDIA_CONTAINER_ROOT:-/mnt/media}/books}:ro
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/plugins:/var/lib/prairie/plugins
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/artwork:/var/lib/prairie/artwork
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/compat:/var/lib/prairie/compat
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/transcode:/tmp/silo-transcode
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/catalog-seeds:/catalog-seeds:ro
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/audiobook-covers:/var/lib/prairie/audiobook-covers
      # Only load-bearing when the Docker host is itself an LXC container, where
      # these three files describe the physical machine and the LXC's own cap
      # sits on a cgroup this container cannot see. lxcfs virtualizes them to the
      # LXC's limits, so passing that view in is what makes CPU, load, and memory
      # report this container's share instead of the whole machine's. Harmless
      # everywhere else: on bare metal or a VM they are the same files Prairie would
      # read anyway. Each is used independently, so dropping one only reverts
      # that reading. See docs/architecture/observability.md#node-resource-sampling.
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/loadavg:/host/proc/loadavg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    devices:
      - /dev/dri:/dev/dri

  # Optional distributed-mode example. Most single-host installs should
  # just use the integrated service above.
  # prairie-proxy:
  #   image: ${PRAIRIE_IMAGE:-ghcr.io/prairie-server/prairie-server:latest}
  #   restart: unless-stopped
  #   profiles: [proxy]
  #   environment:
  #     MODE: proxy
  #     # Must be the SAME SECRET_KEY as the primary node (shared encrypted data).
  #     SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
  #     DATABASE_URL: postgres://${POSTGRES_USER:-prairie}:${POSTGRES_PASSWORD:-prairie}@postgres:5432/${POSTGRES_DB:-prairie}?sslmode=disable
  #     REDIS_URL: redis://redis:6379
