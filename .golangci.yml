version: "2"

run:
  # Diff-scoped CI runs over large PRs exceed 5m on the shared runner (exit 4).
  timeout: 15m
  # Wait for another run on this machine to finish instead of failing after
  # 5s with "parallel golangci-lint is running". A cold run saturates every
  # core, so queueing concurrent runs (several agents, several worktrees)
  # beats running them side by side. Never pass --allow-parallel-runners.
  allow-serial-runners: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/prairie-server/prairie-server

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - govet
    - ineffassign
    - misspell
    - nilerr
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - wastedassign

  exclusions:
    # Anchored regexes, not directory names: `paths` matches anywhere in the
    # path, so a bare `web` also excluded internal/jellycompat/web_component.go,
    # internal/webhooksync/, internal/notifications/webhook*.go and every other
    # non-test file with "web" in its name — 14 files that were being linted
    # before.
    paths:
      - ^web/
      - ^migrations/
    rules:
      # Tests may freely repeat fixture strings / leave cleanup errors unchecked.
      - path: _test\.go
        linters:
          - goconst
          - errcheck
      # Tests may recover a router from a handler to walk it (the route
      # inventory backstops do); they register nothing that ships.
      - path: _test\.go
        linters:
          - gocritic
        text: "^ruleguard: route inventory:"

  settings:
    # gocritic is enabled for exactly one check: the ruleguard rules under
    # internal/routeinventory/lintrules/, defense in depth for the legacy
    # native route inventory (docs/architecture/api-contract.md, "Legacy
    # native route inventory"). The guarantee itself is structural — every
    # listener entry function returns a sealed handler the generator checks —
    # and these rules report the attempt early: a type assertion, type switch
    # or generic instantiation whose type registers routes by its method set
    # (alias, defined type, embedding or structural interface included), and
    # reflect.Value.MethodByName, outside tests. ruleguard was chosen over
    # forbidigo because forbidigo visits only identifier and selector nodes
    # and cannot tell an assertion from a parameter type. Keep the check list
    # to ruleguard: widening it enrolls the whole tree in gocritic's style set.
    #
    # gocritic is deliberately absent from linters.enable above and runs only
    # through make lint-router-recovery (--enable-only gocritic), full-tree,
    # which CI gates on. A changed-lines pass would find nothing that step
    # does not, and it is the costliest linter here: gocritic rebuilds the
    # ruleguard engine for every package, and each rebuild type-checks chi
    # and net/http from source — about two seconds of fixed cost per package,
    # nearly half the analysis time of a cold run over ./... .
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: '${base-path}/internal/routeinventory/lintrules/*.go'
          failOn: all

    sloglint:
      context: "scope"
      static-msg: true
      key-naming-case: snake
      no-mixed-args: true

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Closer.Close
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
        - (*archive/zip.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/redis/go-redis/v9.ClusterClient).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (github.com/gorilla/websocket.Conn).Close
        - (*net/http.Response).Body.Close
        - (*net.TCPListener).Close
        - (mime/multipart.File).Close
        - (*mime/multipart.Part).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*encoding/json.Encoder).Encode
        - os.Remove
        - os.RemoveAll

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    goconst:
      min-len: 5
      min-occurrences: 8
      ignore-tests: true
      ignore-string-values:
        - "true"
        - "false"
        - "asc"
        - "desc"
        - "type"
        - "name"
        - "title"
        - "status"
        - "error"
        - "admin"
        - "between"
        - "contains"
        - "is_not"
        - "libraryId"
        - "libraryItemId"
        - "content_id"
        - "added_at"
        - "created_at"
        - "createdAt"
        - "updatedAt"
        - "userId"
        - "mediaType"
        - "currentTime"
        - "lastUpdate"
        - "release_date"
        - "last_air_date"
        - "content_rating"
        - "rating_imdb"
        - "media_items mi"
        - '\A0 4 \* \* \*\z'
        - '\A0 5 \* \* 0\z'
        - '\A0 6 \* \* \*\z'
        - '\AAmerica/New_York\z'
        - '\Aid::text\z'
        - '\A::jsonb\z'
        - '\Amovie-1\z'
        # Wire codes and vocabulary values that upstream code spells inline.
        - "bad_request"
        - "movie"
        - "series"
        - "ambiguous"
        - "string"
      ignore-functions:
        - fmt.Errorf
        - fmt.Sprintf
        - slog.Info
        - slog.Warn
        - slog.Error
        - slog.Debug
        - slog.InfoContext
        - slog.WarnContext
        - slog.ErrorContext
        - slog.DebugContext

    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - programme
        - programmes
        - analogue
        - behaviour
        - calibre
        - finalise
        - honour
        - honouring
        - marshalling
        - materialised
        - neighbour
        - recognise
        - serialises
        - unrecognised
        # Upstream prose and the "dialogue" marker vocabulary (a wire value).
        - catalogued
        - dialogue
