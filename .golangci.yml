version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/prairie-server/prairie-server

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - govet
    - ineffassign
    - misspell
    - nilerr
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - wastedassign

  exclusions:
    # Anchored regexes, not directory names: `paths` matches anywhere in the
    # path, so a bare `web` also excluded internal/jellycompat/web_component.go,
    # internal/webhooksync/, internal/notifications/webhook*.go and every other
    # non-test file with "web" in its name — 14 files that were being linted
    # before.
    paths:
      - ^web/
      - ^migrations/
    rules:
      # Tests may freely repeat fixture strings / leave cleanup errors unchecked.
      - path: _test\.go
        linters:
          - goconst
          - errcheck

  settings:
    sloglint:
      context: "scope"
      static-msg: true
      key-naming-case: snake
      no-mixed-args: true

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Closer.Close
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
        - (*archive/zip.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/redis/go-redis/v9.ClusterClient).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (github.com/gorilla/websocket.Conn).Close
        - (*net/http.Response).Body.Close
        - (*net.TCPListener).Close
        - (mime/multipart.File).Close
        - (*mime/multipart.Part).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*encoding/json.Encoder).Encode
        - os.Remove
        - os.RemoveAll

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    goconst:
      min-len: 5
      min-occurrences: 8
      ignore-tests: true
      ignore-string-values:
        - "true"
        - "false"
        - "asc"
        - "desc"
        - "type"
        - "name"
        - "title"
        - "status"
        - "error"
        - "admin"
        - "between"
        - "contains"
        - "is_not"
        - "libraryId"
        - "libraryItemId"
        - "content_id"
        - "added_at"
        - "created_at"
        - "createdAt"
        - "updatedAt"
        - "userId"
        - "mediaType"
        - "currentTime"
        - "lastUpdate"
        - "release_date"
        - "last_air_date"
        - "content_rating"
        - "rating_imdb"
        - "media_items mi"
        - '\A0 4 \* \* \*\z'
        - '\A0 5 \* \* 0\z'
        - '\A0 6 \* \* \*\z'
        - '\AAmerica/New_York\z'
        - '\Aid::text\z'
        - '\A::jsonb\z'
        - '\Amovie-1\z'
      ignore-functions:
        - fmt.Errorf
        - fmt.Sprintf
        - slog.Info
        - slog.Warn
        - slog.Error
        - slog.Debug
        - slog.InfoContext
        - slog.WarnContext
        - slog.ErrorContext
        - slog.DebugContext

    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - programme
        - programmes
