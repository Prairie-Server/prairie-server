# Prairie, PostgreSQL, Redis, and optionally Meilisearch, each in a container of
# its own: the layout docker-compose.yml ran before Prairie moved to one
# container, for installs that run or tune those services separately. An
# install of that layout keeps running on it when its .env selects this file
# (named docker-compose.split.yml in earlier builds):
#
#   COMPOSE_FILE=docker-compose.advanced.yml
#
# Prairie's Docker image bundles PostgreSQL and Redis, and leaves both off here
# because DATABASE_URL and REDIS_URL name the services below. It runs Prairie as
# PUID:PGID rather than root, so that account needs read access to MEDIA_ROOT,
# and it takes ownership of the plugins, artwork, compat, transcode, and
# download directories on start.
#
# Hardware transcoding (VA-API or NVIDIA) is commented out in the prairie service.
# New installs should use docker-compose.yml. Moving an install of this layout
# into that single container is opt-in; see "Moving from the multi-container
# stack" in docs/architecture/omnibus-image.md.

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-8gb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prairie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prairie}
      POSTGRES_DB: ${POSTGRES_DB:-prairie}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/postgres:/var/lib/postgresql
    command: ["postgres", "-c", "listen_addresses=*", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prairie}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    # Pinned: Meilisearch will not open data written by another version.
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.54.0}
    restart: unless-stopped
    profiles: [search]
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ -z "$${MEILI_MASTER_KEY:-}" ]; then
          echo "MEILI_MASTER_KEY is required when enabling the search profile" >&2
          exit 1
        fi
        exec /bin/meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_UPGRADE_DB: ${MEILI_UPGRADE_DB:-false}
    ports:
      - "${MEILISEARCH_HOST:-127.0.0.1}:${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/meilisearch:/meili_data

  prairie:
    image: ${PRAIRIE_IMAGE:-ghcr.io/prairie-server/prairie-server:latest}
    restart: unless-stopped
    # On stop Prairie fails readiness, keeps serving for PRAIRIE_SHUTDOWN_DELAY
    # (default 5s), then finishes in-flight requests. Docker kills a container
    # 10s after asking it to stop, which would cut that short. A single server
    # with no load balancer in front can set PRAIRIE_SHUTDOWN_DELAY=0.
    stop_grace_period: 2m
    # NET_ADMIN lets Prairie use kernel BBR congestion control on its client
    # connections and force a larger TCP send buffer for remote clients on
    # long, fast links. A small startup helper holds it until the listeners are
    # configured, then exits; Prairie and its child processes never keep it.
    # NET_ADMIN can change this container's interfaces, routes and firewall
    # rules; see docs/architecture/tcp-congestion.md. Undo: remove this line.
    # PRAIRIE_NET_TCP_CONGESTION=off and PRAIRIE_NET_TCP_SEND_BUFFER=off in .env turn
    # each part off.
    cap_add: [NET_ADMIN]
    environment:
      MODE: integrated
      # The container always listens on these ports. PORT, JF_PORT and ABS_PORT
      # in .env change only the ports published on the host.
      PORT: "8080"
      JF_PORT: "8096"
      ABS_PORT: "13378"
      # The account that runs Prairie and owns its directories. It needs read
      # access to the media. To start without root instead, see
      # https://siloserver.org/docs/docker#run-prairie-without-root
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Master key for at-rest credential encryption. The server refuses to
      # start without it. Generate one with: openssl rand -base64 48
      # Back it up apart from your database dumps; without it, encrypted
      # secrets cannot be recovered. See docs/architecture/secret-encryption.md.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
      DATABASE_URL: postgres://${POSTGRES_USER:-prairie}:${POSTGRES_PASSWORD:-prairie}@postgres:5432/${POSTGRES_DB:-prairie}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PRAIRIE_PLUGIN_CACHE_DIR: /var/lib/prairie/plugins
      POSTGRES_TUNE: ${POSTGRES_TUNE:-auto}
    ports:
      - "${PORT:-8090}:8080"
      - "${JF_PORT:-8096}:8096"
      - "${ABS_PORT:-13378}:13378"
    volumes:
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/plugins:/var/lib/prairie/plugins
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/artwork:/var/lib/prairie/artwork
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/compat:/var/lib/prairie/compat
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/transcode:/tmp/silo-transcode
      # Prepared downloads. While "Prepared file directory" (download.artifact_dir)
      # is blank, Prairie keeps them beside the transcode directory rather than in
      # it, so they need their own mount to survive image updates. This path
      # assumes the default playback.transcode_dir; with another one, mount the
      # silo-download-artifacts directory beside that instead. No storage budget
      # applies until you set one ("Default storage budget per location",
      # download.artifact_max_bytes, in Settings > Downloads).
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/download-artifacts:/tmp/silo-download-artifacts
      - ${PRAIRIE_DATA_ROOT:-/opt/prairie}/catalog-seeds:/catalog-seeds:ro
      # These three matter only when the Docker host is itself an LXC container.
      # There the files describe the physical machine, and the LXC's own limit
      # sits on a cgroup this container cannot see. lxcfs rewrites them to the
      # LXC's limits, so mounting them makes CPU, load, and memory report this
      # container's share instead of the whole machine's. On bare metal or a VM
      # they are the same files Prairie reads anyway, so they do no harm. Prairie uses
      # each one separately; removing one only reverts that reading. See
      # docs/architecture/observability.md#node-resource-sampling.
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/loadavg:/host/proc/loadavg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    # Intel or AMD hardware transcoding (VA-API, Quick Sync): uncomment.
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA, with the NVIDIA Container Toolkit installed: uncomment. "video"
    # mounts the NVENC/NVDEC libraries; without it FFmpeg sees the GPU but
    # encodes in software.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: ${NVIDIA_GPU_COUNT:-1}
    #           capabilities: [gpu, compute, utility, video]
